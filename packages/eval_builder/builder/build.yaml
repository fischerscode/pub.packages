targets:
  $default:
    builders:
      eval_builder:
        enabled: true
        generate_for:
          exclude:
            - test
            - example
          include:
            - test/eval/*
            - test/eval/**/*

builders:
  eval_builder:
    import: "package:eval_builder/eval_builder.dart"
    builder_factories: ["createBuilder"]
    build_extensions: { ".dart": [".eval_builder.g.part"] }
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen:combining_builder"]
